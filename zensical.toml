[project]
site_name = "Heltec V4 Meshtastic walkthrough"
site_description = "Flash and first setup for Heltec WiFi LoRa 32 V4 on Meshtastic."
site_url = "https://meshtastic-heltec-v4-walkthrough.johna.kiwi/"
nav = [
  { "Overview" = "index.md" },
  { "Prerequisites" = "prerequisites.md" },
  { "Identify the board" = "identify.md" },
  { "Bootloader mode" = "bootloader.md" },
  { "Flash firmware" = "flash.md" },
  { "First boot" = "first-boot.md" },
  { "Configure" = "configure.md" },
  { "Phone app" = "phone.md" },
  { "Verify" = "verify.md" },
  { "Troubleshoot" = "troubleshoot.md" },
  { "Reference" = "reference.md" },
]
extra_css = ["stylesheets/site.css"]

[project.theme]
name = "patina"
custom_dir = "overrides"
language = "en"
favicon = "assets/favicon.png"
logo = "assets/icon-512.png"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
toc.permalink = true
zensical.extensions.glightbox = { width = "95vw", height = "auto", zoomable = true }
